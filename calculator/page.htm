<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="calc_container">
        <input id="display" readonly>
        <div id="keys">
            <button onclick="evaluation('+')" class="oprat">+</button> 
            <button onclick="evaluation('7')">7</button>
            <button onclick="evaluation('8')">8</button>
            <button onclick="evaluation('9')">9</button>
            <button onclick="evaluation('-')" class="oprat">-</button>
            <button onclick="evaluation('4')">4</button>
            <button onclick="evaluation('5')">5</button>
            <button onclick="evaluation('6')">6</button>
            <button onclick="evaluation('*')" class="oprat">*</button>
            <button onclick="evaluation('1')">1</button>
            <button onclick="evaluation('2')">2</button>
            <button onclick="evaluation('3')">3</button>
            <button onclick="evaluation('/')" class="oprat">/</button>
            <button onclick="evaluation('0')">0</button>
            <button onclick="evaluation('.')">.</button>
            <button onclick="calcu()">=</button>
            <button onclick="cleared()" class="oprat">C</button>
        </div>
    </div>
    <script src="index.js"> </script>
</body>
</html>
